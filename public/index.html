<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kora — Alquiler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="site-header">
      <p class="brand">Kora</p>
      <p class="tagline">Equipo listo para usar. Alquila en un toque.</p>
    </header>

    <nav class="tabs" role="tablist" aria-label="Secciones">
      <button
        type="button"
        class="tab is-active"
        role="tab"
        id="tab-catalog"
        aria-selected="true"
        aria-controls="panel-catalog"
        data-tab="catalog"
      >
        Catálogo
      </button>
      <button
        type="button"
        class="tab"
        role="tab"
        id="tab-flow"
        aria-selected="false"
        aria-controls="panel-flow"
        data-tab="flow"
      >
        Flujo
      </button>
    </nav>

    <main>
      <section
        id="panel-catalog"
        class="panel is-active"
        role="tabpanel"
        aria-labelledby="tab-catalog"
      >
        <div id="catalog-status" class="status-line" aria-live="polite"></div>
        <div id="catalog-grid" class="catalog-grid"></div>
      </section>

      <section
        id="panel-flow"
        class="panel"
        role="tabpanel"
        aria-labelledby="tab-flow"
        hidden
      >
        <div class="flow-shell">
          <p class="flow-hint" id="flow-hint">
            Aquí se embebe el flujo externo cuando configures
            <code>IFRAME_FLOW_URL</code>.
          </p>
          <iframe
            id="flow-frame"
            class="flow-frame"
            title="Flujo de onboarding"
            loading="lazy"
            referrerpolicy="no-referrer"
          ></iframe>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
